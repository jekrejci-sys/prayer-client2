  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────────────── */
    :root {
      --navy:#0a0a0a;        /* body bg  */
      --navy-mid:#111111;    /* sidebar  */
      --navy-lt:#1a1a1a;     /* cards    */
      --crimson:#d97706;     /* gold accent (replaces crimson for primary actions) */
      --crimson-lt:#f59e0b;  /* gold hover */
      --gold:#d97706;        /* gold     */
      --gold-lt:#f59e0b;     /* gold lt  */
      --parchment:#ffffff;   /* main text */
      --white:#ffffff;
      --muted:#888888;
      --muted-l:#aaaaaa;
      --border:rgba(255,255,255,.08);
      --border-b:rgba(255,255,255,.15);
      --blue:#2563eb;
      --sw:196px; /* sidebar width */
    }

    /* ── RESET ─────────────────────────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:16px}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:var(--navy);
      color:var(--parchment);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ── STAR BG (repurposed as subtle sidebar bg helper) ──────────── */
    .star-bg{display:none} /* hidden — not needed in this design */

    /* ── STRIPES (repurposed as top stripe on sidebar brand) ────────── */
    .stripes-top{display:none}

    /* ── SIDEBAR NAV ───────────────────────────────────────────────── */
    nav{
      position:fixed;
      left:0;top:0;bottom:0;
      width:var(--sw);
      background:var(--navy-mid);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      z-index:100;
      overflow-y:auto;
      /* override sticky/top from original */
      padding:0;
      backdrop-filter:none;
      border-bottom:none;
    }

    /* Brand */
    .nav-inner{
      display:flex;
      flex-direction:column;
      height:100%;
    }
    .nav-brand{
      display:block;
      padding:1.3rem 1.2rem .8rem;
      font-family:'Inter',system-ui,sans-serif;
      font-size:1.1rem;
      font-weight:900;
      letter-spacing:-.02em;
      color:var(--parchment);
      text-decoration:none;
      text-transform:none;
      flex-shrink:0;
    }
    /* color the two words */
    .nav-brand .brand-america{color:#3b82f6}
    .nav-brand .brand-prays  {color:#ef4444}
    .nav-brand .brand-star   {color:var(--gold-lt);font-size:.55em;vertical-align:super}

    /* Nav links list */
    .nav-links{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:.1rem;
      padding:.2rem .6rem;
      flex:1;
    }
    .nav-links li{list-style:none}
    .nav-links a{
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.6rem .85rem;
      border-radius:8px;
      color:var(--muted-l);
      text-decoration:none;
      font-family:'Inter',system-ui,sans-serif;
      font-size:.88rem;
      font-weight:500;
      letter-spacing:0;
      text-transform:none;
      transition:all .15s;
    }
    .nav-links a:hover{
      background:rgba(255,255,255,.06);
      color:var(--parchment);
    }
    .nav-links a.active{
      background:rgba(255,255,255,.1);
      color:var(--parchment);
    }
    .nav-links a.active::after{display:none} /* remove original underline indicator */

    /* Hamburger — hidden on desktop, shown mobile */
    .hamburger{
      display:none;
      flex-direction:column;
      gap:5px;
      cursor:pointer;
      padding:6px;
      background:none;
      border:none;
    }
    .hamburger span{
      display:block;
      width:22px;
      height:2px;
      background:var(--parchment);
      border-radius:2px;
      transition:all .3s;
    }

    /* Mobile menu */
    .mobile-menu{
      display:none;
      flex-direction:column;
      background:var(--navy-mid);
      border-bottom:1px solid var(--border);
    }
    .mobile-menu.open{display:flex}
    .mobile-menu a{
      padding:.72rem 1.5rem;
      color:var(--muted-l);
      text-decoration:none;
      font-family:'Inter',system-ui,sans-serif;
      font-size:.88rem;
      font-weight:500;
      border-bottom:1px solid var(--border);
      transition:all .15s;
    }
    .mobile-menu a:last-child{border-bottom:none}
    .mobile-menu a:hover{color:var(--parchment);background:rgba(255,255,255,.04)}

    /* ── MAIN CONTENT AREA (offset by sidebar) ─────────────────────── */
    #app{
      margin-left:var(--sw);
      position:relative;
      z-index:1;
    }

    /* ── PAGES ─────────────────────────────────────────────────────── */
    .page{display:none;animation:fadeUp .3s ease forwards}
    .page.active{display:block;min-height:calc(100vh - 56px)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* ── TOP BAR (replaces old nav top bar) ────────────────────────── */
    /* The greeting bar and login buttons sit above app in the HTML,
       so we style those to look like Pray.com's top bar */
    .greeting-bar{
      position:sticky;
      top:0;
      z-index:90;
      background:rgba(10,10,10,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      padding:0 1.5rem;
      height:56px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      margin-left:0; /* full width above app */
    }
    .greeting-bar.visible{display:flex}
    .greeting-text{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.78rem;
      font-weight:600;
      color:var(--gold-lt);
      letter-spacing:0;
    }
    .greeting-text span{color:var(--parchment)}

    /* ── HERO ──────────────────────────────────────────────────────── */
    .hero{
      min-height:auto;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-start;
      text-align:left;
      padding:2rem 2rem 0;
    }
    .hero::before{display:none}
    .torch-glow{display:none}

    .hero-eyebrow{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.7rem;
      font-weight:700;
      letter-spacing:.18em;
      color:#ef4444;
      text-transform:uppercase;
      margin-bottom:.4rem;
      display:block;
    }
    .hero-eyebrow::before,.hero-eyebrow::after{display:none}

    .hero-title{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(2.2rem,5vw,3.6rem);
      font-weight:900;
      letter-spacing:-.04em;
      line-height:1.05;
      color:var(--parchment);
      margin-bottom:.5rem;
      text-shadow:none;
    }
    .hero-title em{
      font-style:normal;
      color:#ef4444;
      display:inline;
    }

    .hero-subtitle{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.95rem;
      font-weight:400;
      letter-spacing:0;
      color:var(--muted-l);
      text-transform:none;
      margin-bottom:1rem;
      max-width:520px;
      line-height:1.65;
    }

    .hero-divider{display:none}

    .hero-verse{
      font-size:.9rem;
      font-style:italic;
      color:var(--muted-l);
      max-width:520px;
      line-height:1.65;
      margin-bottom:.25rem;
    }
    .hero-verse-ref{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.7rem;
      font-weight:700;
      letter-spacing:.08em;
      color:var(--gold-lt);
      text-transform:uppercase;
    }

    .hero-cta-wrap{
      margin-top:1.2rem;
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      justify-content:flex-start;
    }

    .scroll-hint{display:none}

    /* ── FILTER ROW (pill tags — Pray.com style) ───────────────────── */
    /* We'll re-use section-label as the filter row header */
    .section-label{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#ef4444;
      margin-bottom:.5rem;
      display:block;
    }
    .section-label::after{display:none}

    /* ── SHARED SECTION ────────────────────────────────────────────── */
    section{padding:2.5rem 2rem}
    .container{max-width:1100px;margin:0 auto}

    .section-title{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1.4rem,3vw,2rem);
      font-weight:800;
      letter-spacing:-.03em;
      color:var(--parchment);
      line-height:1.1;
      margin-bottom:.6rem;
    }
    .section-title span{color:var(--gold-lt)}

    .section-body{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.9rem;
      line-height:1.7;
      color:var(--muted-l);
      max-width:600px;
    }

    /* ── COUNTER (stats bar) ───────────────────────────────────────── */
    .counter-section{
      background:var(--navy-lt);
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
      padding:1.2rem 2rem;
    }
    .counter-grid{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:.5rem;
      flex-wrap:wrap;
      max-width:900px;
      margin:0 auto;
    }
    .counter-item{text-align:center;padding:.2rem 1.2rem}
    .counter-num{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1.8rem,4vw,2.8rem);
      font-weight:900;
      letter-spacing:-.04em;
      color:var(--parchment);
      line-height:1;
      text-shadow:none;
    }
    .counter-label{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.62rem;
      font-weight:500;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--muted);
      margin-top:.15rem;
    }
    .counter-sep{
      font-size:1.4rem;
      color:rgba(255,255,255,.12);
      line-height:1;
      padding-bottom:0;
      font-family:'Inter',system-ui,sans-serif;
    }

    /* ── BUTTONS ───────────────────────────────────────────────────── */
    .btn{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.6rem 1.4rem;
      font-family:'Inter',system-ui,sans-serif;
      font-size:.78rem;
      font-weight:700;
      letter-spacing:.05em;
      text-transform:uppercase;
      text-decoration:none;
      border-radius:5px;
      cursor:pointer;
      transition:all .15s;
      border:none;
    }
    .btn-primary{
      background:var(--gold);
      color:#000;
      box-shadow:none;
    }
    .btn-primary:hover{
      background:var(--gold-lt);
      transform:translateY(-1px);
      box-shadow:none;
    }
    .btn-outline{
      background:transparent;
      color:var(--parchment);
      border:1.5px solid var(--border-b);
    }
    .btn-outline:hover{
      background:rgba(255,255,255,.06);
      transform:translateY(-1px);
      border-color:var(--parchment);
    }

    /* ── PRAYER CARDS ──────────────────────────────────────────────── */
    .prayer-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:.85rem;
      margin-top:1.2rem;
    }
    .prayer-card{
      background:var(--navy-lt);
      border:1px solid var(--border);
      border-radius:10px;
      padding:1.4rem;
      position:relative;
      overflow:hidden;
      transition:border-color .15s,transform .2s,background .15s;
      contain:layout style;
    }
    .prayer-card:hover{
      border-color:var(--border-b);
      transform:translateY(-2px);
      background:#222;
      box-shadow:none;
    }
    .prayer-card::before{display:none} /* remove left color bar */
    /* add a top color line instead */
    .prayer-card::after{
      content:'';
      position:absolute;
      top:0;left:0;right:0;
      height:3px;
      background:linear-gradient(90deg,var(--blue),var(--gold));
      border-radius:10px 10px 0 0;
    }
    .card-week{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.62rem;
      font-weight:700;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:.35rem;
    }
    .card-days{
      font-family:'Inter',system-ui,sans-serif;
      font-size:1.6rem;
      font-weight:900;
      letter-spacing:-.03em;
      color:var(--parchment);
      line-height:1;
      margin-bottom:.45rem;
    }
    .card-theme{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.95rem;
      font-weight:700;
      color:var(--parchment);
      margin-bottom:.4rem;
      line-height:1.3;
    }
    .card-focus{
      font-size:.82rem;
      color:var(--muted-l);
      line-height:1.55;
    }
    .card-verse{
      margin-top:.85rem;
      padding-top:.85rem;
      border-top:1px solid var(--border);
      font-size:.78rem;
      font-style:italic;
      color:var(--gold-lt);
    }

    /* ── DAILY PRAYER ──────────────────────────────────────────────── */
    .day-selector{margin-top:1.5rem}
    .day-tabs{
      display:flex;
      flex-wrap:wrap;
      gap:.35rem;
      margin-bottom:1.4rem;
    }
    .day-tab{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.73rem;
      font-weight:600;
      padding:.3rem .65rem;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      cursor:pointer;
      background:none;
      transition:all .15s;
      letter-spacing:0;
    }
    .day-tab:hover{border-color:var(--border-b);color:var(--parchment)}
    .day-tab.selected{background:var(--blue);border-color:var(--blue);color:#fff}

    .prayer-content{
      background:var(--navy-lt);
      border:1px solid var(--border);
      border-radius:12px;
      padding:2rem;
      position:relative;
    }
    .prayer-day-num{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#ef4444;
      margin-bottom:.35rem;
    }
    .prayer-day-title{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1.4rem,3vw,2rem);
      font-weight:900;
      letter-spacing:-.02em;
      color:var(--parchment);
      margin-bottom:.35rem;
    }
    .prayer-scripture{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.9rem;
      font-style:italic;
      color:var(--gold-lt);
      margin-bottom:1.4rem;
      padding-bottom:1.4rem;
      border-bottom:1px solid var(--border);
      line-height:1.65;
    }
    .prayer-points h4{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.65rem;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:.75rem;
    }
    .prayer-points ul{list-style:none;display:flex;flex-direction:column;gap:.6rem}
    .prayer-points ul li{
      display:flex;gap:.65rem;align-items:flex-start;
      font-size:.9rem;
      color:var(--muted-l);
      line-height:1.6;
    }
    .prayer-points ul li::before{
      content:'→';
      color:var(--blue);
      font-size:.78rem;
      margin-top:.3rem;
      flex-shrink:0;
    }

    /* ── ABOUT ─────────────────────────────────────────────────────── */
    .about-hero{
      background:none;
      padding:2.5rem 2rem 2rem;
      text-align:center;
      border-bottom:1px solid var(--border);
    }
    .about-seal{
      width:70px;height:70px;
      margin:0 auto 1rem;
      border-radius:50%;
      border:2px solid var(--border-b);
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;
      background:rgba(255,255,255,.04);
      box-shadow:none;
      animation:none;
    }
    .about-hero h1{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1.8rem,4vw,3rem);
      font-weight:900;
      letter-spacing:-.03em;
      color:var(--parchment);
      line-height:1.1;
      margin-bottom:.6rem;
    }
    .about-hero h1 em{font-style:italic;color:var(--blue)}
    .about-hero p{
      font-size:.92rem;
      color:var(--muted-l);
      max-width:520px;
      margin:0 auto;
      line-height:1.7;
    }
    .about-content{padding:2.5rem 2rem}
    .about-grid{
      display:grid;
      grid-template-columns:1fr 300px;
      gap:2rem;
      align-items:start;
      max-width:1100px;
      margin:0 auto;
    }
    .about-text h2{
      font-family:'Inter',system-ui,sans-serif;
      font-size:1.22rem;
      font-weight:800;
      letter-spacing:-.02em;
      color:var(--parchment);
      margin-bottom:.6rem;
      margin-top:1.8rem;
      line-height:1.2;
    }
    .about-text h2:first-child{margin-top:0}
    .about-text h2 span{color:var(--blue)}
    .about-text p{
      font-size:.87rem;
      line-height:1.8;
      color:var(--muted-l);
      margin-bottom:.7rem;
    }
    .anniversary-box{
      background:var(--navy-lt);
      border:1px solid var(--border);
      border-radius:12px;
      padding:1.5rem;
      text-align:center;
      position:sticky;
      top:68px;
    }
    .anniversary-num{
      font-family:'Inter',system-ui,sans-serif;
      font-size:3.5rem;
      font-weight:900;
      letter-spacing:-.04em;
      color:var(--parchment);
      line-height:1;
      text-shadow:none;
    }
    .anniversary-label{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.62rem;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      margin-top:.35rem;
    }
    .anniversary-divider{
      height:1px;
      background:var(--border);
      margin:.9rem 0;
    }

    /* ── CTA BANNER ────────────────────────────────────────────────── */
    .cta-banner{
      background:rgba(37,99,235,.12);
      border-top:1px solid rgba(37,99,235,.2);
      border-bottom:1px solid rgba(37,99,235,.2);
      padding:2.5rem 2rem;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .cta-banner::before{display:none}
    .cta-banner h2{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1.4rem,3vw,2.2rem);
      font-weight:900;
      letter-spacing:-.02em;
      color:var(--parchment);
      margin-bottom:.5rem;
      position:relative;
    }
    .cta-banner p{
      font-size:.9rem;
      color:var(--muted-l);
      max-width:520px;
      margin:0 auto 1.5rem;
      line-height:1.65;
      position:relative;
    }

    /* ── QUOTE ─────────────────────────────────────────────────────── */
    .quote-section{
      padding:2rem 2rem;
      background:var(--navy-lt);
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
    }
    .quote-carousel{
      max-width:700px;
      margin:0 auto;
      text-align:center;
    }
    blockquote{
      font-family:'Inter',system-ui,sans-serif;
      font-size:clamp(1rem,2vw,1.22rem);
      font-style:italic;
      color:var(--muted-l);
      line-height:1.65;
      margin-bottom:.9rem;
      position:relative;
      padding:0 1.5rem;
    }
    blockquote::before{
      content:'\201C';
      position:absolute;
      left:-.1rem;top:-.4rem;
      font-size:3rem;
      color:rgba(255,255,255,.08);
      font-family:'Inter',system-ui,sans-serif;
      line-height:1;
    }
    cite{
      font-family:'Inter',system-ui,sans-serif;
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--gold-lt);
      font-style:normal;
    }

    /* ── STRIPE ACCENT ─────────────────────────────────────────────── */
    .stripe-accent{
      height:1px;
      background:var(--border);
      opacity:1;
    }

    /* ── PROCLAMATION ──────────────────────────────────────────────── */
    .proclamation{
      max-width:700px;
      margin:0 auto;
      background:var(--navy-lt);
      border:1px solid var(--border);
      border-radius:10px;
      padding:1.8rem;
      position:relative;
    }
    .proclamation::before,.proclamation::after{
      content:'· · ·';
      display:block;
      text-align:center;
      font-size:.75rem;
      letter-spacing:.5em;
      color:rgba(255,255,255,.15);
    }
    .proclamation::before{margin-bottom:1.2rem}
    .proclamation::after{margin-top:1.2rem}
    .proclamation p{
      font-size:.87rem;
      line-height:1.82;
      color:var(--muted-l);
      text-align:justify;
      margin-bottom:.75rem;
    }

    /* ── SHARE MODAL ───────────────────────────────────────────────── */
    .share-overlay{
      display:none;
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(8px);
      align-items:center;
      justify-content:center;
      padding:1.5rem;
    }
    .share-overlay.open{display:flex;animation:fadeIn .2s ease forwards}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    .share-modal{
      background:#161616;
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      padding:1.8rem;
      max-width:420px;
      width:100%;
      position:relative;
      animation:slideUp .25s ease forwards;
    }
    @keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

    .share-close{
      position:absolute;top:.9rem;right:.9rem;
      background:rgba(255,255,255,.07);
      border:none;
